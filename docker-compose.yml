# LSI 불량 분석 어시스턴트 — 단일 컨테이너.
#   실행:  docker compose up --build       (http://localhost:8001)
#   자격증명은 .env(OPENROUTER_*/JIRA_*)에서 주입 — 이미지에는 안 들어감.
services:
  lsi:
    build: .
    image: lsi-error-analyzer:latest
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      RVP_HOST: "0.0.0.0"
      RVP_PORT: "8001"
    volumes:
      - ./data:/app/data        # 큐레이션 지식·KB 영속(런타임 쓰기 보존)
      - ./tmp_db:/app/tmp_db     # 임베딩 캐시·승인 큐·그래프 영속
    restart: unless-stopped
